<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>送迎表</title>
  <style>
    :root {
      --green: #06c755;
      --green-dark: #05a847;
      --green-bg: #e8f9ef;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --sub: #666666;
      --border: #e0e0e0;
      --red: #e53e3e;
      --red-bg: #fff5f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 40px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    /* ローディング */
    .loading { display: block; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--sub); }

    /* メイン */
    .main { display: none; }
    .icon { font-size: 52px; margin-bottom: 16px; }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 13px;
      color: var(--sub);
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .btn-open {
      display: block;
      width: 100%;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-open:hover { background: var(--green-dark); }
    .btn-back {
      display: block;
      margin-top: 14px;
      font-size: 13px;
      color: var(--sub);
      text-decoration: none;
    }
    .btn-back:hover { color: var(--text); }

    /* エラー */
    .error { display: none; }
    .error-icon { font-size: 44px; margin-bottom: 12px; }
    .error-msg {
      font-size: 14px;
      color: var(--red);
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .btn-retry {
      background: var(--red);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- ローディング -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">送迎表を読み込み中...</div>
  </div>

  <!-- メイン -->
  <div class="main" id="main">
    <div class="icon">🚌</div>
    <div class="title">送迎表</div>
    <div class="desc">下のボタンから今月の送迎表PDFを確認できます。</div>
    <a class="btn-open" id="pdf-link" href="#" target="_blank" rel="noopener">
      📄 送迎表を開く
    </a>
    <a class="btn-back" href="index.html">← メニューに戻る</a>
  </div>

  <!-- エラー -->
  <div class="error" id="error">
    <div class="error-icon">⚠️</div>
    <div class="error-msg" id="error-msg">
      送迎表の読み込みに失敗しました。<br>しばらくしてから再試行してください。
    </div>
    <button class="btn-retry" onclick="init()">再試行</button>
    <a class="btn-back" href="index.html">← メニューに戻る</a>
  </div>

</div>

<script>
const CONFIG = {
  n8nVerifyUrl:   'https://n8n-izanaiset.xvps.jp/webhook/verify-token',
  n8nSettingsUrl: 'https://n8n-izanaiset.xvps.jp/webhook/get-settings',
};

function show(id) {
  ['loading', 'main', 'error'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
}

function showError(msg) {
  if (msg) document.getElementById('error-msg').innerHTML = msg;
  show('error');
}

async function init() {
  show('loading');

  // セッション確認
  const token = localStorage.getItem('session_token');
  if (!token) {
    location.href = 'index.html';
    return;
  }

  try {
    const res  = await fetch(`${CONFIG.n8nVerifyUrl}?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!data.valid) {
      localStorage.removeItem('session_token');
      location.href = 'index.html';
      return;
    }
  } catch (e) {
    // セッション確認失敗時もコンテンツ取得を試みる
  }

  // 設定からBoxリンクを取得
  try {
    const res  = await fetch(CONFIG.n8nSettingsUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const link = data['送迎表リンク'];
    if (!link) {
      showError('送迎表のリンクが設定されていません。<br>管理者にお問い合わせください。');
      return;
    }

    document.getElementById('pdf-link').href = link;
    show('main');
  } catch (e) {
    showError('送迎表の読み込みに失敗しました。<br>しばらくしてから再試行してください。');
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
