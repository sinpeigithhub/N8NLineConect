<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お知らせ</title>
  <style>
    :root {
      --green: #06c755;
      --green-dark: #05a847;
      --green-bg: #e8f9ef;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --sub: #666666;
      --border: #e0e0e0;
      --red: #e53e3e;
      --red-bg: #fff5f5;
      --cat-transport: #3b82f6;
      --cat-transport-bg: #eff6ff;
      --cat-event: #f59e0b;
      --cat-event-bg: #fffbeb;
      --cat-notice: #8b5cf6;
      --cat-notice-bg: #f5f3ff;
      --cat-health: #10b981;
      --cat-health-bg: #ecfdf5;
      --cat-general: #6b7280;
      --cat-general-bg: #f9fafb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      background: var(--green);
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(6,199,85,0.3);
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      max-width: 640px;
      margin: 0 auto;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      border-radius: 8px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.3); }
    .header-title { font-size: 18px; font-weight: 700; }
    .header-badge {
      margin-left: auto;
      background: var(--red);
      color: white;
      border-radius: 99px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 700;
      display: none;
    }

    /* フィルタータブ */
    .filter-wrap {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 64px;
      z-index: 90;
    }
    .filter-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 16px;
      max-width: 640px;
      margin: 0 auto;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: var(--card);
      color: var(--sub);
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    /* メインコンテンツ */
    .main {
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    /* ローディング */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 16px;
      gap: 12px;
      color: var(--sub);
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* エラー */
    .error-box {
      display: none;
      background: var(--red-bg);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin: 24px 0;
    }
    .error-box p { color: var(--red); font-size: 14px; line-height: 1.6; }
    .retry-btn {
      margin-top: 12px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 空状態 */
    .empty {
      display: none;
      text-align: center;
      padding: 64px 16px;
      color: var(--sub);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; }

    /* カードリスト */
    .list { display: flex; flex-direction: column; gap: 10px; }

    /* カード */
    .notice-card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .notice-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateY(-1px); }
    .notice-card.important { border-left: 4px solid var(--red); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 14px 8px;
      flex-wrap: wrap;
    }
    .cat-badge {
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
    }
    .cat-送迎  { background: var(--cat-transport-bg); color: var(--cat-transport); }
    .cat-行事  { background: var(--cat-event-bg);     color: var(--cat-event); }
    .cat-連絡  { background: var(--cat-notice-bg);    color: var(--cat-notice); }
    .cat-健康  { background: var(--cat-health-bg);    color: var(--cat-health); }
    .cat-その他 { background: var(--cat-general-bg);  color: var(--cat-general); }

    .important-badge {
      background: var(--red-bg);
      color: var(--red);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
    }
    .date-label {
      margin-left: auto;
      font-size: 12px;
      color: var(--sub);
      white-space: nowrap;
    }

    .card-body { padding: 0 14px 14px; }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 13px;
      color: var(--sub);
      line-height: 1.7;
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .notice-card.expanded .card-desc {
      -webkit-line-clamp: unset;
      display: block;
    }
    .read-more {
      margin-top: 8px;
      font-size: 12px;
      color: var(--green);
      font-weight: 600;
      text-align: right;
    }
    .notice-card.expanded .read-more { display: none; }

    @media (max-width: 480px) {
      .card-title { font-size: 14px; }
    }
  </style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-inner">
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <span class="header-title">📢 お知らせ</span>
    <span class="header-badge" id="count-badge"></span>
  </div>
</div>

<!-- フィルタータブ -->
<div class="filter-wrap">
  <div class="filter-scroll">
    <button class="filter-chip active" onclick="setFilter('all', this)">すべて</button>
    <button class="filter-chip" onclick="setFilter('重要', this)">🔴 重要</button>
    <button class="filter-chip" onclick="setFilter('送迎', this)">🚌 送迎</button>
    <button class="filter-chip" onclick="setFilter('行事', this)">🎉 行事</button>
    <button class="filter-chip" onclick="setFilter('連絡', this)">📋 連絡</button>
    <button class="filter-chip" onclick="setFilter('健康', this)">💊 健康</button>
    <button class="filter-chip" onclick="setFilter('その他', this)">📌 その他</button>
  </div>
</div>

<!-- メイン -->
<div class="main">
  <!-- ローディング -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>お知らせを読み込み中...</span>
  </div>

  <!-- エラー -->
  <div class="error-box" id="error-box">
    <p id="error-msg">データの取得に失敗しました。</p>
    <button class="retry-btn" onclick="fetchNotices()">再試行</button>
  </div>

  <!-- 空 -->
  <div class="empty" id="empty">
    <div class="empty-icon">📭</div>
    <div class="empty-text">該当するお知らせはありません</div>
  </div>

  <!-- リスト -->
  <div class="list" id="list"></div>
</div>

<script>
  const CONFIG = {
    n8nVerifyUrl:  'https://n8n-izanaiset.xvps.jp/webhook/verify-token',
    n8nNoticesUrl: 'https://n8n-izanaiset.xvps.jp/webhook/get-notices',
  };

  let allNotices = [];
  let activeFilter = 'all';

  // =====================
  // セッション確認
  // =====================
  async function checkSession() {
    const token = localStorage.getItem('session_token');
    if (!token) {
      location.href = 'index.html';
      return;
    }
    try {
      const res = await fetch(`${CONFIG.n8nVerifyUrl}?token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if (!data.valid) {
        location.href = 'index.html';
        return;
      }
    } catch (e) {
      // セッション確認失敗時もデータ取得は試みる
    }
    fetchNotices();
  }

  // =====================
  // お知らせ取得
  // =====================
  async function fetchNotices() {
    showLoading();
    try {
      const res = await fetch(CONFIG.n8nNoticesUrl, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      // n8nから返ってくるのが配列直接か {notices:[]} どちらにも対応
      allNotices = Array.isArray(data) ? data : (data.notices || data.data || []);
      renderList();
    } catch (e) {
      showError('お知らせの取得に失敗しました。\nしばらく待ってから再試行してください。');
    }
  }

  // =====================
  // フィルター
  // =====================
  function setFilter(filter, btn) {
    activeFilter = filter;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  // =====================
  // レンダリング
  // =====================
  function renderList() {
    const filtered = activeFilter === 'all'   ? allNotices
                   : activeFilter === '重要'  ? allNotices.filter(n => n.important === true || n.important === 'TRUE' || n.important === '1')
                   : allNotices.filter(n => n.category === activeFilter);

    const badge = document.getElementById('count-badge');
    if (allNotices.length > 0) {
      badge.style.display = 'inline-block';
      badge.textContent = filtered.length + '件';
    }

    hideAll();
    const list = document.getElementById('list');

    if (filtered.length === 0) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    list.innerHTML = filtered.map((n, i) => {
      const isImportant = n.important === true || n.important === 'TRUE' || n.important === '1';
      const catClass = 'cat-' + (n.category || 'その他');
      const dateStr = formatDate(n.date || n['日付'] || '');
      const title = n.title || n['タイトル'] || '';
      const body  = n.body  || n['本文']    || '';
      const cat   = n.category || n['カテゴリ'] || 'その他';
      return `
        <div class="notice-card${isImportant ? ' important' : ''}" id="card-${i}" onclick="toggleCard(${i})">
          <div class="card-header">
            <span class="cat-badge ${catClass}">${cat}</span>
            ${isImportant ? '<span class="important-badge">🔴 重要</span>' : ''}
            <span class="date-label">${dateStr}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${escHtml(title)}</div>
            <div class="card-desc">${escHtml(body)}</div>
            <div class="read-more">続きを読む ▼</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleCard(i) {
    document.getElementById('card-' + i).classList.toggle('expanded');
  }

  // =====================
  // ユーティリティ
  // =====================
  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const w = ['日','月','火','水','木','金','土'][d.getDay()];
    return `${m}/${day}（${w}）`;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function showLoading() {
    hideAll();
    document.getElementById('loading').style.display = 'flex';
  }
  function showError(msg) {
    hideAll();
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-box').style.display = 'block';
  }
  function hideAll() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('list').innerHTML = '';
  }

  // 起動
  checkSession();
</script>
</body>
</html>
